<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d8c9a1" />
    <meta
      name="description"
      content="A full-page gradient inspired by the Let It Be studio backdrop."
    />
    <meta name="robots" content="noindex" />
    <title>Let It Be Gradient</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background-color: #d8c9a1;
      }

      main {
        position: fixed;
        inset: -4%;
        width: auto;
        min-height: 0;
        transform-origin: center;
        will-change: transform, filter;
        animation: ambient-lights 34s ease-in-out infinite alternate;
        background:
          radial-gradient(
            ellipse 54% 62% at 48% 64%,
            rgba(255, 240, 173, 0.98) 0%,
            rgba(249, 235, 170, 0.88) 35%,
            rgba(237, 226, 164, 0.22) 76%,
            rgba(229, 224, 158, 0) 100%
          ),
          radial-gradient(
            ellipse 47% 63% at -2% 88%,
            rgba(115, 75, 187, 0.72) 0%,
            rgba(157, 69, 187, 0.54) 48%,
            rgba(192, 83, 174, 0) 100%
          ),
          radial-gradient(
            ellipse 55% 94% at -6% 20%,
            rgba(179, 57, 177, 0.98) 0%,
            rgba(201, 78, 169, 0.84) 36%,
            rgba(218, 114, 151, 0.28) 74%,
            rgba(221, 135, 144, 0) 100%
          ),
          radial-gradient(
            ellipse 48% 55% at 79% 78%,
            rgba(75, 218, 139, 0.88) 0%,
            rgba(111, 224, 145, 0.68) 44%,
            rgba(164, 224, 145, 0.2) 76%,
            rgba(192, 216, 135, 0) 100%
          ),
          radial-gradient(
            ellipse 46% 66% at 108% 14%,
            rgba(229, 60, 25, 0.99) 0%,
            rgba(237, 99, 37, 0.88) 39%,
            rgba(229, 147, 59, 0.34) 74%,
            rgba(210, 178, 89, 0) 100%
          ),
          radial-gradient(
            ellipse 77% 63% at 61% -8%,
            rgba(82, 220, 155, 0.96) 0%,
            rgba(135, 230, 159, 0.84) 43%,
            rgba(191, 231, 158, 0.26) 79%,
            rgba(213, 221, 148, 0) 100%
          ),
          linear-gradient(110deg, #ae47b1 0%, #e8c4ab 32%, #beeaae 68%, #d95a2d 100%);
      }

      @keyframes ambient-lights {
        0% {
          transform: translate3d(-1.2%, -0.8%, 0) scale(1.025);
          filter: saturate(1) brightness(1);
        }

        35% {
          transform: translate3d(1%, -1.1%, 0) scale(1.045);
          filter: saturate(1.04) brightness(1.015);
        }

        68% {
          transform: translate3d(0.7%, 1%, 0) scale(1.03);
          filter: saturate(1.01) brightness(0.995);
        }

        100% {
          transform: translate3d(-0.9%, 0.7%, 0) scale(1.05);
          filter: saturate(1.055) brightness(1.01);
        }
      }

      .grain {
        position: fixed;
        inset: -30%;
        width: 160%;
        height: 160%;
        opacity: 0.14;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
          transform: scale(1.025);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Soft magenta, cream, green, and orange studio gradient"></main>
    <svg class="grain" aria-hidden="true">
      <filter id="film-grain">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.78"
          numOctaves="4"
          seed="8"
          stitchTiles="stitch"
        />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#film-grain)" />
    </svg>
  </body>
</html>
