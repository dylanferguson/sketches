<!doctype html>
<!--
  Frequency Trails — an animated ridgeline plot in the spirit of Joy Division's
  "Unknown Pleasures", with an adjustable ocean "ferocity".
  Concept reference: https://www.brendangregg.com/FrequencyTrails/intro.html
  Authored by: Claude Opus 4.8 (via Cursor)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="generator" content="Claude Opus 4.8 (via Cursor)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A living ridgeline plot in the spirit of Unknown Pleasures: stacked white waveforms whose energy rolls left to right like waves in profile."
    />
    <meta name="robots" content="noindex" />
    <title>Frequency Trails</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 1;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        user-select: none;
      }

      .controls input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: min(46vw, 240px);
        height: 2px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }

      .controls input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
      }

      .controls input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Animated ridgeline plot of stacked waveforms"></canvas>
    <div class="controls">
      <span>Calm</span>
      <input
        id="ferocity"
        type="range"
        min="0"
        max="1"
        step="0.001"
        value="0.25"
        aria-label="Ocean ferocity"
      />
      <span>Ferocious</span>
    </div>
    <script>
      (() => {
        "use strict";

        const TAU = Math.PI * 2;
        const canvas = document.getElementById("scene");
        const ctx = canvas.getContext("2d", { alpha: false });
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

        // Ocean ferocity in [0, 1]: a single dial for how wild the sea is. It
        // scales wave speed, peak height, ripple size, and high-frequency chop.
        const ferocitySlider = document.getElementById("ferocity");
        let ferocity = parseFloat(ferocitySlider.value);

        // Rows are drawn back (top) to front (bottom). Central rows carry tall
        // peaks; the top and bottom rows stay nearly flat. Each row's shape is
        // built once from a seeded PRNG; the animation only advances the phase of
        // travelling wave packets so their energy rolls left to right over time.
        const ROWS = 72;

        // Wave packets travel across a span a little wider than the plot so they
        // enter from off the left edge and leave off the right edge seamlessly.
        const MARGIN = 0.18;
        const SPAN = 1 + MARGIN * 2;

        function mulberry32(seed) {
          let a = seed >>> 0;
          return () => {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Where energy is allowed to stand tall horizontally: strong in the
        // middle, fading to near nothing at the far left and right, so packets
        // crest as they pass through the centre and recede toward the edges.
        function crestEnvelope(x) {
          const u = (x - 0.5) / 0.26;
          return Math.exp(-0.5 * u * u);
        }

        // A broader fade for the baseline ripple, keeping the extreme edges calm
        // without flattening the ripple across the whole width.
        function rippleEnvelope(x) {
          const u = (x - 0.5) / 0.44;
          return Math.exp(-0.5 * u * u);
        }

        function wrapSpan(x) {
          let y = x + MARGIN;
          y -= Math.floor(y / SPAN) * SPAN;
          return y - MARGIN;
        }

        function buildRows() {
          const rand = mulberry32(0x5eed1917);
          const rows = [];
          for (let i = 0; i < ROWS; i++) {
            const t = i / (ROWS - 1);
            // Central-peak envelope: a Gaussian bump centred just above the
            // middle, so peaks fade to almost nothing at the top and bottom.
            const env = Math.exp(-0.5 * Math.pow((t - 0.5) / 0.24, 2));

            const packets = [];
            const count = 3 + Math.floor(rand() * 4);
            for (let k = 0; k < count; k++) {
              packets.push({
                base: rand() * SPAN - MARGIN,
                width: 0.02 + rand() * 0.05,
                height: 0.22 + Math.pow(rand(), 1.5) * 1.02,
                // Rightward drift, in fractions of plot width per second.
                speed: 0.03 + rand() * 0.045,
              });
            }

            // Gentle travelling sines give every row a continuous, living
            // baseline (never dead-flat) that also drifts to the right.
            const ripples = [];
            for (let k = 0; k < 3; k++) {
              ripples.push({
                freq: 1 + Math.floor(rand() * 3),
                phase: rand() * TAU,
                amp: 0.008 + rand() * 0.016,
                speed: 0.15 + rand() * 0.35,
              });
            }

            rows.push({ env, packets, ripples, turbPhase: rand() * TAU });
          }
          return rows;
        }

        const rows = buildRows();

        // Sample a row's normalized height at position nx in [0, 1]. The time
        // argument is a ferocity-scaled wave clock (see the animation loop).
        function sample(row, nx, time) {
          const f = ferocity;
          const ampScale = 0.55 + f * 1.25;
          const rippleScale = 0.6 + f * 1.15;
          const turbAmp = f * f * 0.05;

          let rip = 0;
          for (let r = 0; r < row.ripples.length; r++) {
            const rp = row.ripples[r];
            // sin(k*x - w*t) travels toward +x, i.e. left to right.
            rip += rp.amp * Math.sin(TAU * rp.freq * nx - time * rp.speed + rp.phase);
          }
          rip *= rippleScale;

          // High-frequency chop that only surfaces as the sea gets rough.
          const turb =
            turbAmp *
            (Math.sin(TAU * 8 * nx - time * 1.6 + row.turbPhase) +
              0.6 * Math.sin(TAU * 15 * nx - time * 2.4 + row.turbPhase * 1.7));

          let v = (rip + turb) * (0.28 + 0.72 * row.env) * rippleEnvelope(nx);

          for (let p = 0; p < row.packets.length; p++) {
            const pk = row.packets[p];
            const center = wrapSpan(pk.base + pk.speed * time);
            const u = (nx - center) / pk.width;
            // Height is gated by where the packet currently sits, so it swells
            // as it rolls through the centre and settles toward the edges.
            v += pk.height * ampScale * Math.exp(-0.5 * u * u) * crestEnvelope(center) * row.env;
          }

          return v;
        }

        // The baseline grid keeps a 4:5 portrait aspect; extra headroom above it
        // leaves room for the tallest central peaks to rise without clipping.
        let dpr = 1;
        let W = 0;
        let H = 0;
        const box = { x: 0, top: 0, w: 0, h: 0, rowGap: 0, amp: 0, cols: 0 };

        function layout() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const pad = Math.min(W, H) * 0.05;
          // Reserve room at the bottom so the plot never crowds the slider.
          const controlsSpace = 72;
          const availW = W - pad * 2;
          const availH = H - pad * 2 - controlsSpace;

          const headroomRatio = 0.14;
          const boxW = Math.min(availW, availH / (1.25 * (1 + headroomRatio)));
          const boxH = boxW * 1.25;
          const headroom = boxH * headroomRatio;
          const totalH = boxH + headroom;

          box.w = boxW;
          box.h = boxH;
          box.x = (W - boxW) / 2;
          box.top = (H - controlsSpace - totalH) / 2 + headroom;
          box.rowGap = boxH / (ROWS - 1);
          box.amp = box.rowGap * 8;
          box.cols = Math.max(160, Math.min(420, Math.round(boxW / 2.2)));
        }

        const pts = [];

        function traceCurve(n) {
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < n - 1; i++) {
            const xc = (pts[i].x + pts[i + 1].x) / 2;
            const yc = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
          }
          ctx.quadraticCurveTo(pts[n - 2].x, pts[n - 2].y, pts[n - 1].x, pts[n - 1].y);
        }

        function render(time) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);

          const cols = box.cols;
          const x0 = box.x;
          const bw = box.w;
          const bottom = H + 2;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#ffffff";

          for (let i = 0; i < ROWS; i++) {
            const row = rows[i];
            const baseY = box.top + i * box.rowGap;

            for (let c = 0; c < cols; c++) {
              const nx = c / (cols - 1);
              const v = sample(row, nx, time);
              if (!pts[c]) pts[c] = { x: 0, y: 0 };
              pts[c].x = x0 + nx * bw;
              pts[c].y = baseY - v * box.amp;
            }

            // Fill the area under the curve with black so this (nearer) row
            // occludes everything already drawn behind it: hidden-line removal.
            ctx.beginPath();
            traceCurve(cols);
            ctx.lineTo(x0 + bw, bottom);
            ctx.lineTo(x0, bottom);
            ctx.closePath();
            ctx.fillStyle = "#000";
            ctx.fill();

            // Stroke the profile as one continuous white line.
            ctx.beginPath();
            traceCurve(cols);
            ctx.stroke();
          }
        }

        // Accumulate a wave clock at a ferocity-scaled rate so moving the slider
        // changes how fast the sea rolls without snapping the wave phase.
        let waveTime = 0;
        let last = null;
        function frame(now) {
          if (last === null) last = now;
          let dt = (now - last) / 1000;
          last = now;
          if (dt > 0.1) dt = 0.1; // avoid a jump after the tab was inactive
          waveTime += dt * (0.12 + ferocity * 2.6);
          render(waveTime);
          requestAnimationFrame(frame);
        }

        function init() {
          layout();
          if (reduceMotion) {
            render(waveTime);
          } else {
            requestAnimationFrame(frame);
          }
        }

        ferocitySlider.addEventListener("input", () => {
          ferocity = parseFloat(ferocitySlider.value);
          if (reduceMotion) render(waveTime);
        });

        let resizeTimer = null;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            layout();
            if (reduceMotion) render(waveTime);
          }, 80);
        });

        init();
      })();
    </script>
  </body>
</html>
