<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <meta name="description" content="A whole life, shown as one 24-hour day." />
    <title>Once Around</title>
    <!--
      A life as a single 24-hour day. Companion to the life-calendar sketch,
      which counts the same span in weeks.

      The dial follows the Soviet Raketa "Polar" (Полярные), a 24-hour watch
      built for Antarctic expedition crews: 0 at the top, 12 at the bottom, one
      rotation per day. A 12-hour dial would put 9am and 9pm in the same place.
      Broad hand is the life, red seconds hand is the current time of day on
      the same scale.

      The clock nods to the cover of John Mayer's Born and Raised: reverse-
      painted glass by David Adrian Smith, lettering in coins, faces and clocks.

      Defaults to born 1994 and 81.1 years, the period life expectancy for an
      Australian male (ABS 2021-2023). Override with ?dob=YYYY-MM-DD and ?le=
    -->
    <style>
      :root {
        --blue: #1f30c8;
        --paper: #f2f5fc;
        --muted: rgba(242, 245, 252, 0.66);
        --rule: rgba(242, 245, 252, 0.35);
        --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, serif;
        --sans:
          "Gill Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--blue);
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--blue);
        color: var(--paper);
        font-family: var(--serif);
      }

      .page {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100svh;
        padding: clamp(24px, 4vw, 52px);
      }

      h1 {
        margin: 0;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      main {
        display: grid;
        place-items: center;
        align-content: center;
        gap: clamp(16px, 3vh, 28px);
        padding-block: 28px;
      }

      .dial {
        display: block;
        width: min(64vmin, 470px);
        height: auto;
      }

      .reading {
        text-align: center;
      }

      .clock {
        margin: 0;
        font-size: clamp(48px, 8vw, 84px);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .summary {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
      }

      form {
        display: flex;
        gap: 24px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      input {
        width: 118px;
        padding: 0 0 5px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        background: none;
        color: var(--paper);
        color-scheme: dark;
        font: inherit;
        font-family: var(--serif);
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        text-transform: none;
      }

      input:focus-visible {
        border-bottom-color: var(--paper);
        outline: none;
      }

      .scale {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      /* The dial keeps the original's grotesque. */
      .print {
        font-family: Helvetica, Arial, sans-serif;
        font-weight: 700;
        fill: var(--paper);
      }

      @media (max-width: 620px) {
        .page {
          padding: 24px 20px 28px;
        }

        .dial {
          width: min(82vw, 390px);
        }

        footer {
          align-items: start;
          flex-direction: column;
          gap: 18px;
        }

        .scale {
          order: -1;
        }
      }

      @media (max-height: 760px) and (min-width: 621px) {
        .dial {
          width: min(48vh, 400px);
        }

        main {
          gap: 14px;
          padding-block: 16px;
        }

        .clock {
          font-size: 52px;
        }
      }

      @media print {
        form {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header><h1>Once Around</h1></header>

      <main>
        <svg class="dial" viewBox="40 44 352 352" role="img" aria-labelledby="caption">
          <title id="caption">A 24-hour polar dial showing one life as a single day</title>
          <defs>
            <path id="arc-brand" d="" />
            <path id="arc-made" d="" />
            <clipPath id="dial-clip">
              <circle cx="216" cy="220" r="168" />
            </clipPath>
          </defs>

          <g id="dial" clip-path="url(#dial-clip)"></g>
          <g id="hands"></g>
        </svg>

        <div class="reading">
          <p class="clock" id="life-time">--:--</p>
          <p class="summary"><span id="age">--</span> old · <span id="elapsed">--</span> elapsed</p>
        </div>
      </main>

      <footer>
        <form id="controls" autocomplete="off">
          <label>
            Born
            <input type="date" id="dob" required />
          </label>
          <label>
            Lifespan
            <input
              type="number"
              id="le"
              min="1"
              max="150"
              step="0.1"
              required
              aria-label="Expected lifespan in years"
            />
          </label>
        </form>
        <p class="scale">1 dial minute = <span id="scale">--</span></p>
      </footer>
    </div>

    <script type="module">
      const DAY_MS = 24 * 60 * 60 * 1000;
      const YEAR_MS = 365.2425 * DAY_MS;
      const SVG_NS = "http://www.w3.org/2000/svg";
      const CENTRE = { x: 216, y: 220 };
      // The globe's outer parallel, and the ring the hour markers sit on.
      const GLOBE_R = 93;
      // The dial is printed in one weight throughout.
      const PRINT = "#eef2fd";
      const PRINT_W = 1.3;
      // Cap height of the dial face, as a fraction of its size.
      const CAP_HEIGHT = 0.717;
      const DIAL = "#1f30c8";

      const params = new URL(document.location).searchParams;
      const state = {
        // Matches the default birth date used by the life-calendar sketch.
        dob: parseDate(params.get("dob")) ?? new Date(1994, 3, 8),
        // Cohort tables put this nearer 82.5, about ten minutes earlier on the dial.
        le: Number(params.get("le")) || 81.1,
      };

      function parseDate(value) {
        if (!value) return null;
        const parsed = new Date(`${value}T00:00:00`);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function node(tag, attributes = {}, text) {
        const created = document.createElementNS(SVG_NS, tag);
        for (const [name, value] of Object.entries(attributes)) {
          created.setAttribute(name, value);
        }
        if (text !== undefined) created.textContent = text;
        return created;
      }

      // 0 at the top, clockwise, one rotation per 24 hours.
      function atHour(hour, radius) {
        return atAngle((hour / 24) * 360, radius);
      }

      function atAngle(degrees, radius) {
        const radians = ((degrees - 90) * Math.PI) / 180;
        return {
          x: CENTRE.x + Math.cos(radians) * radius,
          y: CENTRE.y + Math.sin(radians) * radius,
        };
      }

      function arcPath(fromDegrees, toDegrees, radius) {
        const start = atAngle(fromDegrees, radius);
        const end = atAngle(toDegrees, radius);
        const sweep = toDegrees - fromDegrees > 180 ? 1 : 0;
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${sweep} 1 ${end.x} ${end.y}`;
      }

      // Anticlockwise arc, for text running left to right along the bottom.
      function arcPathBack(fromDegrees, toDegrees, radius) {
        const start = atAngle(fromDegrees, radius);
        const end = atAngle(toDegrees, radius);
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 0 0 ${end.x} ${end.y}`;
      }

      function drawMinuteTrack(dial) {
        // 240 notches, four to the minute. They share an inner edge and the
        // minute notches extend out toward the numbered edge of the track.
        for (let notch = 0; notch < 240; notch++) {
          const minute = notch % 4 === 0;
          const numbered = notch % 20 === 0;
          const degrees = (notch / 240) * 360;
          const inner = atAngle(degrees, 143);
          const outer = atAngle(degrees, minute && !numbered ? 159 : 152);
          dial.append(
            node("line", {
              x1: inner.x,
              y1: inner.y,
              x2: outer.x,
              y2: outer.y,
              stroke: PRINT,
              "stroke-width": PRINT_W,
            }),
          );
        }
        for (let minute = 5; minute <= 60; minute += 5) {
          const degrees = (minute / 60) * 360;
          const at = atAngle(degrees, 159);
          dial.append(
            node(
              "text",
              {
                class: "print",
                x: at.x,
                y: at.y,
                "font-size": 9,
                "text-anchor": "middle",
                "dominant-baseline": "central",
                transform: `rotate(${degrees} ${at.x} ${at.y})`,
              },
              String(minute),
            ),
          );
        }
      }

      function drawHourNumerals(dial) {
        for (let hour = 0; hour < 24; hour++) {
          const at = atHour(hour, 120);
          dial.append(
            node(
              "text",
              {
                class: "print",
                x: at.x,
                y: at.y,
                "font-size": 21,
                "text-anchor": "middle",
                "dominant-baseline": "central",
              },
              String(hour),
            ),
          );
        }
        for (let hour = 0; hour < 24; hour++) {
          const at = atHour(hour, GLOBE_R);
          const onGrid = hour <= 6 || hour >= 18;
          dial.append(
            onGrid
              ? node("circle", { cx: at.x, cy: at.y, r: 4, fill: PRINT })
              : node("path", {
                  d: "M 0 -5.8 L 3.5 0 L 0 5.8 L -3.5 0 Z",
                  fill: PRINT,
                  transform: `translate(${at.x} ${at.y}) rotate(${(hour / 24) * 360})`,
                }),
          );
        }
      }

      function drawPolarGrid(dial) {
        // A patch off a globe: meridians radiate from the pole at the pivot and
        // parallels arc across them, ending on the beaded hour markers.
        const grid = node("g", {
          fill: "none",
          stroke: PRINT,
          "stroke-width": PRINT_W,
        });
        for (let hour = -6; hour <= 6; hour++) {
          const degrees = (hour / 24) * 360;
          const end = atAngle(degrees, GLOBE_R);
          grid.append(
            node("path", {
              d: `M ${CENTRE.x} ${CENTRE.y} L ${end.x} ${end.y}`,
            }),
          );
        }
        for (const radius of [24, 41, 58, 75, GLOBE_R]) {
          grid.append(node("path", { d: arcPath(-90, 90, radius) }));
        }
        dial.append(grid);
      }

      function drawRibbon(dial) {
        const outer = 74;
        const inner = 57;
        const span = 88;
        const a = atAngle(-span / 2, outer);
        const b = atAngle(span / 2, outer);
        const c = atAngle(span / 2, inner);
        const d = atAngle(-span / 2, inner);
        dial.append(
          node("path", {
            d: `M ${a.x} ${a.y} A ${outer} ${outer} 0 0 1 ${b.x} ${b.y}
                L ${c.x} ${c.y} A ${inner} ${inner} 0 0 0 ${d.x} ${d.y} Z`,
            fill: DIAL,
            stroke: PRINT,
            "stroke-width": PRINT_W,
            "stroke-linejoin": "round",
          }),
        );
        // Cap height runs a little over half the band, as on the original.
        const size = ((outer - inner) * 0.58) / CAP_HEIGHT;
        fitToArc(dial, "arc-brand", "ПОЛЯРНЫЕ", size, span, (outer + inner) / 2, true);
      }

      // Seat a line of text in the middle of an arc band, shrinking it only if
      // it would overrun. Glyphs grow away from the baseline, so the arc itself
      // sits half a cap height off centre, outward at the top and inward at the
      // bottom where the text is the other way up.
      function fitToArc(dial, pathId, words, size, span, midRadius, atTop) {
        const path = document.getElementById(pathId);
        const label = node("text", { class: "print", "font-size": size });
        const textPath = node("textPath", {
          href: `#${pathId}`,
          startOffset: "50%",
          "text-anchor": "middle",
        });
        textPath.textContent = words;
        label.append(textPath);
        dial.append(label);

        const seat = (radius) =>
          path.setAttribute(
            "d",
            atTop
              ? arcPath(-span / 2, span / 2, radius)
              : arcPathBack(180 + span / 2, 180 - span / 2, radius),
          );

        seat(midRadius);
        const room = ((span * Math.PI * midRadius) / 180) * 0.88;
        const width = textPath.getComputedTextLength();
        if (width > room) {
          size = (size * room) / width;
          label.setAttribute("font-size", size);
        }
        seat(midRadius + (atTop ? -1 : 1) * CAP_HEIGHT * 0.5 * size);
      }

      function drawLandscape(dial) {
        const base = CENTRE.y + 56;
        const ridge = [
          [-52, 1],
          [-36, -14],
          [-26, -7],
          [-13, -25],
          [-2, -42],
          [7, -22],
          [15, -30],
          [24, -13],
          [35, -20],
          [46, -3],
          [54, 1],
        ];
        dial.append(
          node("path", {
            d: ridge
              .map(([dx, dy], index) => `${index ? "L" : "M"} ${CENTRE.x + dx} ${base + dy}`)
              .join(" "),
            fill: "none",
            stroke: PRINT,
            "stroke-width": PRINT_W,
            "stroke-linejoin": "round",
          }),
        );
        dial.append(
          node("path", {
            d: `M ${CENTRE.x - 2} ${base - 42} L ${CENTRE.x + 5} ${base - 17}
                M ${CENTRE.x + 15} ${base - 30} L ${CENTRE.x + 20} ${base - 14}
                M ${CENTRE.x - 13} ${base - 25} L ${CENTRE.x - 18} ${base - 10}`,
            fill: "none",
            stroke: PRINT,
            "stroke-width": PRINT_W,
          }),
        );

        fitToArc(dial, "arc-made", "СДЕЛАНО В СССР", 10, 72, 80, false);
      }

      function drawHands() {
        const hands = document.getElementById("hands");
        hands.append(
          // Life hand. Moves about a degree a month.
          node("path", {
            id: "hand-life",
            d: `M -6.5 15 L -5.4 -34 L -4.2 -94 L -2.1 -110 L 0 -116
                L 2.1 -110 L 4.2 -94 L 5.4 -34 L 6.5 15 Z`,
            fill: "#f2efe2",
            stroke: "#14161c",
            "stroke-width": 1,
            "stroke-linejoin": "round",
          }),
          // Day hand, with the counterweight a seconds hand carries.
          node("path", {
            id: "hand-day",
            d: "M -1 34 L -1 -140 L 1 -140 L 1 34 Z",
            fill: "#d4212a",
          }),
          node("circle", { id: "hand-day-tail", r: 6, fill: "#d4212a" }),
          node("circle", { cx: CENTRE.x, cy: CENTRE.y, r: 6.5, fill: "#1d2028" }),
          node("circle", { cx: CENTRE.x, cy: CENTRE.y, r: 2.1, fill: "#c4cad5" }),
        );
      }

      function pointHand(id, hour) {
        const rotation = (hour / 24) * 360;
        document
          .getElementById(id)
          .setAttribute("transform", `translate(${CENTRE.x} ${CENTRE.y}) rotate(${rotation})`);
      }

      function formatHours(hours) {
        const whole = Math.floor(hours);
        const minutes = Math.floor((hours - whole) * 60);
        return `${String(whole).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      function formatSpan(ms) {
        const years = Math.floor(ms / YEAR_MS);
        const months = Math.floor((ms - years * YEAR_MS) / (YEAR_MS / 12));
        return `${years}y ${months}m`;
      }

      function tick() {
        const now = new Date();
        const lived = now - state.dob;
        const lifetime = state.le * YEAR_MS;
        const fraction = lived / lifetime;
        const today = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 3600;

        pointHand("hand-life", fraction * 24);
        pointHand("hand-day", today);
        const tail = atHour(today + 12, 24);
        const tailNode = document.getElementById("hand-day-tail");
        tailNode.setAttribute("cx", tail.x);
        tailNode.setAttribute("cy", tail.y);

        document.getElementById("life-time").textContent = formatHours(Math.min(fraction, 1) * 24);
        document.getElementById("age").textContent = formatSpan(lived);
        document.getElementById("elapsed").textContent = `${(fraction * 100).toFixed(1)}%`;

        const perMinute = lifetime / 1440 / DAY_MS;
        document.getElementById("scale").textContent = `${perMinute.toFixed(1)} days`;
      }

      function bindControls() {
        const dob = document.getElementById("dob");
        const le = document.getElementById("le");
        dob.value = new Date(state.dob.getTime() - state.dob.getTimezoneOffset() * 60000)
          .toISOString()
          .slice(0, 10);
        le.value = state.le;

        document.getElementById("controls").addEventListener("input", () => {
          const nextDob = parseDate(dob.value);
          const nextLe = Number(le.value);
          if (nextDob) state.dob = nextDob;
          if (nextLe > 0) state.le = nextLe;
          tick();
        });
      }

      const dial = document.getElementById("dial");
      drawPolarGrid(dial);
      drawRibbon(dial);
      drawLandscape(dial);
      drawMinuteTrack(dial);
      drawHourNumerals(dial);
      drawHands();
      bindControls();
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
