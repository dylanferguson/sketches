<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="A broken Japanese tea bowl repaired with gold, floating in pieces. Drag the slider to scatter the shards or bring them back together."
    />
    <title>Kintsugi</title>
    <!--
      A raku-style tea bowl, fractured into shards and mended with gold.

      The bowl is a surface of revolution sampled on a parametric grid. A
      Voronoi partition over warped 3D surface points decides which shard each
      grid cell belongs to; cells whose neighbour sits in another shard grow a
      side wall, so every piece is a closed solid with real fracture faces. The
      seams are painted with a gold overlay whose width follows the distance to
      the nearest Voronoi boundary.

      Generated with Claude Code (Claude Opus 5).
    -->
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 18%, #2a2119 0%, #17120d 55%, #0c0906 100%);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: max(28px, env(safe-area-inset-bottom));
        z-index: 1;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgb(240 224 196 / 0.55);
        user-select: none;
      }

      .controls input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: min(48vw, 260px);
        height: 2px;
        background: rgb(240 224 196 / 0.25);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }

      .controls input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #e7bd67;
      }

      .controls input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: #e7bd67;
      }

      .hint {
        position: fixed;
        margin: 0;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 1;
        transform: translateX(-50%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgb(240 224 196 / 0.28);
        user-select: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.180.0",
          "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="A broken ceramic tea bowl mended with gold"></canvas>
    <div class="controls">
      <span>Whole</span>
      <input
        id="scatter"
        type="range"
        min="0"
        max="1"
        step="0.001"
        value="0.35"
        aria-label="Scatter the shards"
      />
      <span>Scattered</span>
    </div>
    <p class="hint">Drag to orbit</p>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const TAU = Math.PI * 2;

      // Parametric resolution of the bowl: NU steps around, NV steps along the
      // profile. Fracture lines follow cell edges, so the grid has to be fine
      // enough that the steps read as a ragged break rather than a staircase.
      const NU = 280;
      const NV = 112;

      const SHARD_COUNT = 16;
      const MAX_SCATTER = 1.35; // world units; the cap on how far pieces drift
      const VEIN_WIDTH = 0.019; // half-width of a gold seam, in world units

      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---------------------------------------------------------------------
      // Small deterministic helpers
      // ---------------------------------------------------------------------

      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(0x6b1f7a3d);

      function smoothstep(t) {
        const x = Math.min(1, Math.max(0, t));
        return x * x * (3 - 2 * x);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Periodic value noise, used for glaze mottling and for varying the
      // width of the gold seams so they thicken and thin like brushed lacquer.
      const NOISE_PERIOD = 9;

      function latticeValue(i, j) {
        const x = ((i % NOISE_PERIOD) + NOISE_PERIOD) % NOISE_PERIOD;
        let n = Math.imul(x, 374761393) + Math.imul(j, 668265263);
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
      }

      function noise2(x, y) {
        const fx = x * NOISE_PERIOD;
        const fy = y * NOISE_PERIOD;
        const ix = Math.floor(fx);
        const iy = Math.floor(fy);
        const tx = smoothstep(fx - ix);
        const ty = smoothstep(fy - iy);
        const a = latticeValue(ix, iy);
        const b = latticeValue(ix + 1, iy);
        const c = latticeValue(ix, iy + 1);
        const d = latticeValue(ix + 1, iy + 1);
        return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
      }

      // ---------------------------------------------------------------------
      // The bowl: a surface of revolution with a wall of varying thickness
      // ---------------------------------------------------------------------

      // Profile in (radius, height), read from the underside of the foot up to
      // the rim. The dip near the centre gives the bowl a shallow foot ring.
      const profile = new THREE.SplineCurve([
        new THREE.Vector2(0.0, 0.048),
        new THREE.Vector2(0.13, 0.028),
        new THREE.Vector2(0.25, 0.011),
        new THREE.Vector2(0.33, 0.022),
        new THREE.Vector2(0.42, 0.082),
        new THREE.Vector2(0.52, 0.185),
        new THREE.Vector2(0.61, 0.305),
        new THREE.Vector2(0.685, 0.43),
        new THREE.Vector2(0.74, 0.545),
        new THREE.Vector2(0.79, 0.64),
      ]);

      const profilePoints = profile.getSpacedPoints(NV);

      // Thicker at the foot, thinner at the lip.
      function wallThickness(v) {
        return lerp(0.088, 0.031, smoothstep(v));
      }

      // Profile normals by central difference; for a bowl opening upward the
      // outward normal tilts down and away from the axis.
      const profileNormals = profilePoints.map((_, j) => {
        const a = profilePoints[Math.max(0, j - 1)];
        const b = profilePoints[Math.min(NV, j + 1)];
        const dr = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dr, dy) || 1;
        return new THREE.Vector2(dy / len, -dr / len);
      });

      const vertexCount = (NV + 1) * NU;
      const outerPos = new Float32Array(vertexCount * 3);
      const innerPos = new Float32Array(vertexCount * 3);
      const vertNormal = new Float32Array(vertexCount * 3);

      // Parameter-space home of every grid vertex. Vertices that land on a
      // fracture are nudged along the surface onto the crack itself, so a break
      // reads as a smooth curve rather than a staircase of cell edges.
      const gridU = new Float32Array(vertexCount);
      const gridV = new Float32Array(vertexCount);

      const index = (j, i) => j * NU + (((i % NU) + NU) % NU);
      const vi = (j, i) => index(j, i) * 3;

      for (let j = 0; j <= NV; j++) {
        for (let i = 0; i < NU; i++) {
          const n = index(j, i);
          gridU[n] = i / NU;
          gridV[n] = j / NV;
        }
      }

      // The profile between its sampled points, read by linear interpolation so
      // moved vertices stay on the same surface the grid describes.
      const prof = { r: 0, y: 0, nr: 0, ny: 0, thickness: 0 };

      function sampleProfile(v) {
        const clamped = Math.min(1, Math.max(0, v));
        const f = clamped * NV;
        const j = Math.min(NV - 1, Math.floor(f));
        const t = f - j;
        const a = profilePoints[j];
        const b = profilePoints[j + 1];
        const na = profileNormals[j];
        const nb = profileNormals[j + 1];
        prof.r = lerp(a.x, b.x, t);
        prof.y = lerp(a.y, b.y, t);
        const nr = lerp(na.x, nb.x, t);
        const ny = lerp(na.y, nb.y, t);
        const len = Math.hypot(nr, ny) || 1;
        prof.nr = nr / len;
        prof.ny = ny / len;
        prof.thickness = wallThickness(clamped);
        return prof;
      }

      const outerScratch = new THREE.Vector3();

      function outerAt(u, v) {
        const p = sampleProfile(v);
        const a = u * TAU;
        return outerScratch.set(p.r * Math.cos(a), p.y, p.r * Math.sin(a));
      }

      function writeVertex(n, u, v) {
        const p = sampleProfile(v);
        const a = u * TAU;
        const c = Math.cos(a);
        const s = Math.sin(a);
        const k = n * 3;
        outerPos[k] = p.r * c;
        outerPos[k + 1] = p.y;
        outerPos[k + 2] = p.r * s;
        vertNormal[k] = p.nr * c;
        vertNormal[k + 1] = p.ny;
        vertNormal[k + 2] = p.nr * s;
        innerPos[k] = outerPos[k] - vertNormal[k] * p.thickness;
        innerPos[k + 1] = outerPos[k + 1] - vertNormal[k + 1] * p.thickness;
        innerPos[k + 2] = outerPos[k + 2] - vertNormal[k + 2] * p.thickness;
      }

      for (let n = 0; n < vertexCount; n++) writeVertex(n, gridU[n], gridV[n]);

      // ---------------------------------------------------------------------
      // The break: a Voronoi partition over warped surface points
      // ---------------------------------------------------------------------

      // Displacing a query point before measuring distances bends the Voronoi
      // boundaries, so cracks wander instead of running dead straight.
      const warped = new THREE.Vector3();

      function warpPoint(x, y, z) {
        warped.set(
          x + 0.075 * Math.sin(4.1 * y + 3.7 * z) + 0.022 * Math.sin(11.3 * z - 7.1 * y),
          y + 0.075 * Math.sin(3.3 * x + 4.9 * z + 1.3) + 0.022 * Math.sin(12.7 * x + 6.1 * z),
          z + 0.075 * Math.sin(4.7 * x + 3.1 * y + 2.1) + 0.022 * Math.sin(10.9 * y - 8.3 * x),
        );
        return warped;
      }

      // Seeds are surface points, spread with a simple blue-noise rejection so
      // the bowl breaks into pieces of comparable, but not equal, size.
      const seeds = [];
      for (let attempt = 0; attempt < 4000 && seeds.length < SHARD_COUNT; attempt++) {
        // Bias v upward: the walls carry more surface area than the foot.
        const candidate = outerAt(rand(), Math.pow(rand(), 0.75)).clone();
        const spacing = 0.32 - 0.12 * (seeds.length / SHARD_COUNT);
        if (seeds.every((s) => s.distanceTo(candidate) > spacing)) seeds.push(candidate);
      }

      // Nearest and second-nearest seed distances. Half their difference is a
      // good estimate of the distance to the fracture line itself.
      const voronoiResult = { index: 0, second: 0, seam: 0, signed: 0 };

      function voronoi(x, y, z) {
        const q = warpPoint(x, y, z);
        let best = Infinity;
        let second = Infinity;
        let nearest = 0;
        for (let k = 0; k < seeds.length; k++) {
          const d = q.distanceTo(seeds[k]);
          if (d < best) {
            second = best;
            best = d;
            nearest = k;
          } else if (d < second) {
            second = d;
          }
        }
        voronoiResult.index = nearest;
        voronoiResult.seam = (second - best) * 0.5;
        voronoiResult.signed = best - second;
        return voronoiResult;
      }

      // Which shard owns each cell.
      const cellShard = new Int32Array(NV * NU);
      for (let j = 0; j < NV; j++) {
        for (let i = 0; i < NU; i++) {
          const a = vi(j, i);
          const b = vi(j, i + 1);
          const c = vi(j + 1, i);
          const d = vi(j + 1, i + 1);
          const cx = (outerPos[a] + outerPos[b] + outerPos[c] + outerPos[d]) * 0.25;
          const cy = (outerPos[a + 1] + outerPos[b + 1] + outerPos[c + 1] + outerPos[d + 1]) * 0.25;
          const cz = (outerPos[a + 2] + outerPos[b + 2] + outerPos[c + 2] + outerPos[d + 2]) * 0.25;
          cellShard[j * NU + i] = voronoi(cx, cy, cz).index;
        }
      }

      // Pull the vertices that separate two shards onto the fracture line. A
      // couple of Newton steps on "distance to the nearest seed minus distance
      // to the next" is enough; the step is capped at a fraction of a cell so a
      // vertex can never fold past its neighbours.
      function crackDistance(u, v) {
        const p = outerAt(u, v);
        return voronoi(p.x, p.y, p.z).signed;
      }

      const stepU = 0.55 / NU;
      const stepV = 0.55 / NV;
      const epsU = 0.2 / NU;
      const epsV = 0.2 / NV;

      for (let j = 0; j <= NV; j++) {
        for (let i = 0; i < NU; i++) {
          // A vertex sits on a crack when its surrounding cells disagree.
          const cells = [
            cellShard[Math.min(NV - 1, j) * NU + (((i % NU) + NU) % NU)],
            cellShard[Math.min(NV - 1, j) * NU + ((((i - 1) % NU) + NU) % NU)],
            cellShard[Math.max(0, j - 1) * NU + (((i % NU) + NU) % NU)],
            cellShard[Math.max(0, j - 1) * NU + ((((i - 1) % NU) + NU) % NU)],
          ];
          if (cells.every((c) => c === cells[0])) continue;

          const n = index(j, i);
          let u = gridU[n];
          let v = gridV[n];
          for (let iter = 0; iter < 3; iter++) {
            const f = crackDistance(u, v);
            const gu = (crackDistance(u + epsU, v) - crackDistance(u - epsU, v)) / (2 * epsU);
            const gv = (crackDistance(u, v + epsV) - crackDistance(u, v - epsV)) / (2 * epsV);
            const g2 = gu * gu + gv * gv;
            if (!(g2 > 1e-9)) break;
            const scale = -f / g2;
            u += Math.max(-stepU, Math.min(stepU, scale * gu));
            v = Math.min(1, Math.max(0, v + Math.max(-stepV, Math.min(stepV, scale * gv))));
          }
          gridU[n] = u;
          gridV[n] = v;
          writeVertex(n, u, v);
        }
      }

      // How far each vertex ended up from the nearest crack, which is what
      // decides where the gold is painted.
      const vertSeam = new Float32Array(vertexCount);
      for (let n = 0; n < vertexCount; n++) {
        const k = n * 3;
        vertSeam[n] = voronoi(outerPos[k], outerPos[k + 1], outerPos[k + 2]).seam;
      }

      // ---------------------------------------------------------------------
      // Colour
      // ---------------------------------------------------------------------

      const glazeLight = new THREE.Color("#cbb896");
      const glazeDark = new THREE.Color("#8a7654");
      const glazeWarm = new THREE.Color("#a58a60");
      const goldBase = new THREE.Color("#c9922e");
      const goldBright = new THREE.Color("#f2d178");
      const scratch = new THREE.Color();

      function glazeColor(u, v, out) {
        const mottle = noise2(u, v * 0.6);
        const fine = noise2(u * 2.3 + 0.17, v * 1.7 + 0.41);
        out.copy(glazeDark).lerp(glazeLight, smoothstep(mottle * 0.8 + fine * 0.35));
        // A faint iron blush low on the wall, as raku glaze pools and darkens.
        out.lerp(glazeWarm, 0.35 * (1 - smoothstep(v * 1.4)) * (0.4 + 0.6 * fine));
        return out;
      }

      function goldColor(u, v, out) {
        const n = noise2(u * 1.9 + 0.63, v * 2.1 + 0.29);
        return out.copy(goldBase).lerp(goldBright, 0.25 + 0.65 * n);
      }

      // Gold is laid on wider in places, the way a brush loads unevenly.
      function veinWidth(u, v) {
        return VEIN_WIDTH * (0.55 + 1.15 * noise2(u * 1.4 + 0.31, v * 1.1 + 0.77));
      }

      // ---------------------------------------------------------------------
      // Shard geometry
      // ---------------------------------------------------------------------

      // Each shard collects three vertex streams: the glazed ceramic surfaces,
      // the opaque gold that fills the fracture walls, and a translucent gold
      // overlay that paints the seams onto the glaze.
      const shards = Array.from({ length: seeds.length }, () => ({
        ceramic: { pos: [], nrm: [], col: [] },
        gold: { pos: [], nrm: [], col: [] },
        vein: { pos: [], nrm: [], col: [] },
      }));

      const eA = new THREE.Vector3();
      const eB = new THREE.Vector3();
      const faceNormal = new THREE.Vector3();

      // Push a quad as two triangles, flipping the winding when the corners
      // wind against the intended facing direction.
      function pushQuad(stream, p0, p1, p2, p3, normals, colors, facing) {
        eA.set(p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]);
        eB.set(p2[0] - p0[0], p2[1] - p0[1], p2[2] - p0[2]);
        faceNormal.crossVectors(eA, eB);
        const flipped = faceNormal.dot(facing) < 0;
        const order = flipped ? [0, 3, 2, 0, 2, 1] : [0, 1, 2, 0, 2, 3];
        const corners = [p0, p1, p2, p3];
        for (const c of order) {
          stream.pos.push(corners[c][0], corners[c][1], corners[c][2]);
          stream.nrm.push(normals[c][0], normals[c][1], normals[c][2]);
          const col = colors[c];
          stream.col.push(col[0], col[1], col[2], col.length > 3 ? col[3] : 1);
        }
      }

      const cornerOffsets = [
        [0, 0],
        [1, 0],
        [1, 1],
        [0, 1],
      ];

      function readVertex(grid, j, i) {
        const k = vi(j, i);
        return [grid[k], grid[k + 1], grid[k + 2]];
      }

      function readNormal(j, i, sign) {
        const k = vi(j, i);
        return [vertNormal[k] * sign, vertNormal[k + 1] * sign, vertNormal[k + 2] * sign];
      }

      const facingScratch = new THREE.Vector3();

      for (let j = 0; j < NV; j++) {
        for (let i = 0; i < NU; i++) {
          const shard = shards[cellShard[j * NU + i]];

          const cj = cornerOffsets.map(([di, dj]) => j + dj);
          const ci = cornerOffsets.map(([di]) => i + di);

          const outer = cj.map((jj, n) => readVertex(outerPos, jj, ci[n]));
          const inner = cj.map((jj, n) => readVertex(innerPos, jj, ci[n]));
          const outN = cj.map((jj, n) => readNormal(jj, ci[n], 1));
          const inN = cj.map((jj, n) => readNormal(jj, ci[n], -1));

          const uv = cornerOffsets.map(([di, dj]) => [(i + di) / NU, (j + dj) / NV]);
          const glaze = uv.map(([u, v]) => {
            glazeColor(u, v, scratch);
            return [scratch.r, scratch.g, scratch.b];
          });

          // Glazed surfaces, outside and in.
          facingScratch.fromArray(outN[0]);
          pushQuad(
            shard.ceramic,
            outer[0],
            outer[1],
            outer[2],
            outer[3],
            outN,
            glaze,
            facingScratch,
          );
          facingScratch.fromArray(inN[0]);
          pushQuad(
            shard.ceramic,
            inner[0],
            inner[1],
            inner[2],
            inner[3],
            inN,
            glaze,
            facingScratch,
          );

          // Gold seams painted over the glaze, where a crack runs close by.
          const seams = cornerOffsets.map(([di, dj]) => vertSeam[vi(j + dj, i + di) / 3]);
          const alphas = seams.map((s, n) => 1 - smoothstep(s / veinWidth(uv[n][0], uv[n][1])));
          if (alphas.some((a) => a > 0.01)) {
            const goldCols = uv.map(([u, v], n) => {
              goldColor(u, v, scratch);
              return [scratch.r, scratch.g, scratch.b, alphas[n]];
            });
            const lift = 0.0035;
            const outerLift = outer.map((p, n) => [
              p[0] + outN[n][0] * lift,
              p[1] + outN[n][1] * lift,
              p[2] + outN[n][2] * lift,
            ]);
            const innerLift = inner.map((p, n) => [
              p[0] + inN[n][0] * lift,
              p[1] + inN[n][1] * lift,
              p[2] + inN[n][2] * lift,
            ]);
            facingScratch.fromArray(outN[0]);
            pushQuad(
              shard.vein,
              outerLift[0],
              outerLift[1],
              outerLift[2],
              outerLift[3],
              outN,
              goldCols,
              facingScratch,
            );
            facingScratch.fromArray(inN[0]);
            pushQuad(
              shard.vein,
              innerLift[0],
              innerLift[1],
              innerLift[2],
              innerLift[3],
              inN,
              goldCols,
              facingScratch,
            );
          }

          // Walls, wherever this cell meets a different shard, the rim, or the
          // degenerate pole at the centre of the foot. Fracture walls are gold;
          // the lip of the bowl stays ceramic.
          const sides = [
            { a: 1, b: 2, nj: j, ni: i + 1 }, // toward +u
            { a: 3, b: 0, nj: j, ni: i - 1 }, // toward -u
            { a: 2, b: 3, nj: j + 1, ni: i }, // toward the rim
            { a: 0, b: 1, nj: j - 1, ni: i }, // toward the foot
          ];

          for (const side of sides) {
            const isRim = side.nj > NV - 1;
            const isPole = side.nj < 0;
            if (isPole) continue; // the profile closes on the axis; no wall needed
            const neighbour = isRim ? -1 : cellShard[side.nj * NU + (((side.ni % NU) + NU) % NU)];
            if (!isRim && neighbour === cellShard[j * NU + i]) continue;

            const p0 = outer[side.a];
            const p1 = outer[side.b];
            const p2 = inner[side.b];
            const p3 = inner[side.a];

            // Face away from this cell's centre, so the wall is outward-facing.
            facingScratch.set(
              (p0[0] + p1[0]) * 0.5 - (outer[0][0] + outer[2][0]) * 0.5,
              (p0[1] + p1[1]) * 0.5 - (outer[0][1] + outer[2][1]) * 0.5,
              (p0[2] + p1[2]) * 0.5 - (outer[0][2] + outer[2][2]) * 0.5,
            );
            if (facingScratch.lengthSq() < 1e-12) continue;
            facingScratch.normalize();

            const wallN = [0, 1, 2, 3].map(() => facingScratch.toArray());

            if (isRim) {
              const rimCols = [glaze[side.a], glaze[side.b], glaze[side.b], glaze[side.a]];
              pushQuad(shard.ceramic, p0, p1, p2, p3, wallN, rimCols, facingScratch);
            } else {
              const goldCols = [side.a, side.b, side.b, side.a].map((n) => {
                goldColor(uv[n][0], uv[n][1], scratch);
                return [scratch.r, scratch.g, scratch.b, 1];
              });
              pushQuad(shard.gold, p0, p1, p2, p3, wallN, goldCols, facingScratch);
            }
          }
        }
      }

      // ---------------------------------------------------------------------
      // Scene
      // ---------------------------------------------------------------------

      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.8;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      camera.position.set(0.9, 1.3, 3.6);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
      scene.environmentIntensity = 1.0;

      const key = new THREE.DirectionalLight(0xfff2dc, 1.15);
      key.position.set(2.4, 3.4, 2.2);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0x9fb6d8, 0.45);
      rim.position.set(-2.6, 1.2, -2.2);
      scene.add(rim);

      // A soft light from the viewer's side, so the gold seams keep their
      // sheen even where the key light does not reach.
      const fill = new THREE.DirectionalLight(0xffe6c4, 0.55);
      fill.position.set(0.6, 0.5, 3.2);
      scene.add(fill);

      scene.add(new THREE.AmbientLight(0xd8c6a8, 0.18));

      const ceramicMaterial = new THREE.MeshPhysicalMaterial({
        vertexColors: true,
        roughness: 0.52,
        metalness: 0.0,
        clearcoat: 0.35,
        clearcoatRoughness: 0.35,
        envMapIntensity: 0.32,
      });

      const goldMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        metalness: 1.0,
        roughness: 0.3,
        envMapIntensity: 2.2,
        // Snapping vertices onto the crack leaves the odd sliver of wall wound
        // the other way round, so draw both faces.
        side: THREE.DoubleSide,
      });

      const veinMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        metalness: 1.0,
        roughness: 0.22,
        envMapIntensity: 2.2,
        transparent: true,
        depthWrite: false,
      });

      function buildMesh(stream, material) {
        if (stream.pos.length === 0) return null;
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(stream.pos), 3),
        );
        geometry.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(stream.nrm), 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(stream.col), 4));
        return new THREE.Mesh(geometry, material);
      }

      const bowl = new THREE.Group();
      scene.add(bowl);

      // The bowl breaks apart around a point a little above its foot, so the
      // pieces fan outward instead of sliding sideways.
      const PIVOT = new THREE.Vector3(0, 0.3, 0);
      const pieces = [];

      for (const shard of shards) {
        if (shard.ceramic.pos.length === 0) continue;

        const centroid = new THREE.Vector3();
        const positions = shard.ceramic.pos;
        for (let k = 0; k < positions.length; k += 3) {
          centroid.x += positions[k];
          centroid.y += positions[k + 1];
          centroid.z += positions[k + 2];
        }
        centroid.multiplyScalar(3 / positions.length);

        for (const stream of [shard.ceramic, shard.gold, shard.vein]) {
          for (let k = 0; k < stream.pos.length; k += 3) {
            stream.pos[k] -= centroid.x;
            stream.pos[k + 1] -= centroid.y;
            stream.pos[k + 2] -= centroid.z;
          }
        }

        const group = new THREE.Group();
        for (const [stream, material] of [
          [shard.ceramic, ceramicMaterial],
          [shard.gold, goldMaterial],
          [shard.vein, veinMaterial],
        ]) {
          const mesh = buildMesh(stream, material);
          if (mesh) group.add(mesh);
        }
        bowl.add(group);

        const direction = centroid.clone().sub(PIVOT);
        if (direction.lengthSq() < 1e-8) direction.set(0, -1, 0);
        direction.normalize();
        // A little sideways drift keeps the scatter from looking like a
        // perfectly radial explosion.
        direction
          .add(new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).multiplyScalar(0.35))
          .normalize();

        const axis = new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize();

        pieces.push({
          group,
          home: centroid,
          direction,
          reach: MAX_SCATTER * (0.45 + 0.55 * rand()),
          spin: new THREE.Quaternion().setFromAxisAngle(axis, (0.35 + rand()) * 1.1),
          rest: new THREE.Quaternion(),
        });
      }

      const controls = new OrbitControls(camera, canvas);
      controls.target.copy(PIVOT);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 1.6;
      controls.maxDistance = 7;
      controls.maxPolarAngle = Math.PI * 0.92;
      controls.update();

      const slider = document.getElementById("scatter");
      let scatter = parseFloat(slider.value);
      slider.addEventListener("input", () => {
        scatter = parseFloat(slider.value);
      });

      function layout() {
        for (const piece of pieces) {
          const distance = piece.reach * scatter;
          piece.group.position.copy(piece.home).addScaledVector(piece.direction, distance);
          piece.group.quaternion.copy(piece.rest).slerp(piece.spin, Math.pow(scatter, 1.15));
        }
      }

      // A tall, narrow viewport crops a vertical field of view, so widen it
      // until the scattered pieces fit across the screen instead.
      const BASE_FOV = 38;

      function resize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (canvas.width === width && canvas.height === height) return;
        renderer.setSize(width, height, false);
        const aspect = width / height;
        camera.aspect = aspect;
        camera.fov =
          aspect >= 1
            ? BASE_FOV
            : Math.min(
                72,
                THREE.MathUtils.radToDeg(
                  2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV) / 2) / aspect),
                ),
              );
        camera.updateProjectionMatrix();
      }

      let previous = performance.now();

      function frame(now) {
        const dt = Math.min((now - previous) / 1000, 0.05);
        previous = now;
        resize();
        layout();
        if (!reduceMotion) bowl.rotation.y += dt * 0.12;
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    </script>
  </body>
</html>
