<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mooring Buoy</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --text: #111111;
        --muted: rgb(17 17 17 / 0.6);
        --buoy: #ff4f2e;
        --btn-bg: rgb(255 255 255 / 0.7);
        --btn-bg-hover: rgb(255 255 255 / 0.95);
        --btn-border: rgb(17 17 17 / 0.2);
        --btn-border-hover: rgb(17 17 17 / 0.45);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0a0f1c;
        --text: #e8eef5;
        --muted: rgb(232 238 245 / 0.6);
        --btn-bg: rgb(20 28 46 / 0.7);
        --btn-bg-hover: rgb(20 28 46 / 0.95);
        --btn-border: rgb(232 238 245 / 0.22);
        --btn-border-hover: rgb(232 238 245 / 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 1;
        width: min(320px, calc(100vw - 48px));
        user-select: none;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.45;
      }

      .hud a {
        color: inherit;
        text-decoration-color: currentColor;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .hud a:hover {
        color: var(--text);
      }

      .corner-btn {
        position: fixed;
        top: 24px;
        z-index: 1;
        width: 36px;
        height: 36px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        backdrop-filter: blur(4px);
        transition:
          background 120ms ease,
          border-color 120ms ease;
      }

      .corner-btn:hover {
        background: var(--btn-bg-hover);
        border-color: var(--btn-border-hover);
      }

      .corner-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      .audio-toggle {
        right: 24px;
      }
      .theme-toggle {
        right: 70px;
      }

      .audio-toggle .icon-on,
      .theme-toggle .icon-on {
        display: none;
      }
      .audio-toggle[data-on="true"] .icon-on,
      .theme-toggle[data-on="true"] .icon-on {
        display: block;
      }
      .audio-toggle[data-on="true"] .icon-off,
      .theme-toggle[data-on="true"] .icon-off {
        display: none;
      }

      @media (max-width: 680px) {
        .hud {
          top: 14px;
          left: 14px;
          width: min(260px, calc(100vw - 128px));
        }
        .corner-btn {
          top: 14px;
        }
        .audio-toggle {
          right: 14px;
        }
        .theme-toggle {
          right: 60px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="hud" aria-label="Info">
      <h1>Mooring Buoy</h1>
      <p>Vector-styled study. Drag to orbit, scroll to zoom.</p>
    </aside>

    <button
      class="corner-btn theme-toggle"
      id="theme-toggle"
      data-on="false"
      aria-label="Toggle night mode"
      title="Toggle night mode"
    >
      <svg
        class="icon-off"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
      <svg
        class="icon-on"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>

    <button
      class="corner-btn audio-toggle"
      id="audio-toggle"
      data-on="false"
      aria-label="Toggle ambient audio"
      title="Toggle ambient audio"
    >
      <svg
        class="icon-off"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M11 5 6 9H3v6h3l5 4z" />
        <line x1="22" y1="9" x2="16" y2="15" />
        <line x1="16" y1="9" x2="22" y2="15" />
      </svg>
      <svg
        class="icon-on"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M11 5 6 9H3v6h3l5 4z" />
        <path d="M15.5 8.5a5 5 0 0 1 0 7" />
        <path d="M18.5 5.5a9 9 0 0 1 0 13" />
      </svg>
    </button>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      /* ─── Theme ─── */
      const THEMES = {
        light: {
          bg: 0xffffff,
          water: 0xffffff,
          line: 0x111111,
          contactLine: 0x111111,
          hemiSky: 0xb8f2ff,
          hemiGround: 0xffffff,
          hemiIntensity: 1.8,
          keyColor: 0xffffff,
          keyIntensity: 2.2,
          fillColor: 0x7ec8ff,
          fillIntensity: 0.9,
        },
        dark: {
          bg: 0x0a0f1c,
          water: 0x0a0f1c,
          line: 0xe8eef5,
          contactLine: 0x000000,
          hemiSky: 0x2b3a5a,
          hemiGround: 0x05080f,
          hemiIntensity: 1.2,
          keyColor: 0xb8c8ff,
          keyIntensity: 1.4,
          fillColor: 0x4a6090,
          fillIntensity: 0.6,
        },
      };

      const stored = localStorage.getItem("mooring-buoy-theme");
      const prefersDark =
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      let themeName = stored || (prefersDark ? "dark" : "light");
      let theme = THEMES[themeName];

      /* ─── Scene ─── */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(theme.bg);

      const camera = new THREE.PerspectiveCamera(
        38,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 3.1, 24); // pulled back, looking down on the buoy

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 2.4;
      controls.maxDistance = 10;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.target.set(0, 0.15, 0);

      /* ─── Star field (dark mode only) ─── */
      const STAR_COUNT = 2500;
      const STAR_RADIUS = 56;

      function createStarTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, "rgba(255, 255, 255, 1)");
        grad.addColorStop(0.2, "rgba(255, 255, 255, 0.6)");
        grad.addColorStop(0.5, "rgba(255, 255, 255, 0.1)");
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const starTexture = createStarTexture();

      function createNightBackgroundTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 8;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#050914");
        grad.addColorStop(0.42, "#08101f");
        grad.addColorStop(0.58, "#10243f");
        grad.addColorStop(0.7, "#0b1629");
        grad.addColorStop(1, "#0a0f1c");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const nightBackgroundTexture = createNightBackgroundTexture();

      function generateStarDome(count, radius) {
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const size = new Float32Array(count);
        const phase = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          const theta = Math.random() * Math.PI * 2;
          const cosPhi = 0.035 + Math.pow(Math.random(), 1.65) * 0.965;
          const phi = Math.acos(cosPhi);
          const r = radius * (0.9 + Math.random() * 0.1);
          pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = r * Math.cos(phi) + 1.2;
          pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

          const warmth = Math.random();
          const shade = 0.9 + Math.random() * 0.1;
          col[i * 3] = shade;
          col[i * 3 + 1] = shade * (0.95 + warmth * 0.05);
          col[i * 3 + 2] = shade * (0.95 + (1 - warmth) * 0.15);

          const sizeRoll = Math.random();
          if (sizeRoll > 0.985) size[i] = 1.75 + Math.random() * 0.65;
          else if (sizeRoll > 0.92) size[i] = 1.05 + Math.random() * 0.5;
          else size[i] = 0.52 + Math.random() * 0.5;
          phase[i] = Math.random() * Math.PI * 2;
        }
        return { pos, col, size, phase };
      }

      const {
        pos: starPos,
        col: starCol,
        size: starSize,
        phase: starPhase,
      } = generateStarDome(STAR_COUNT, STAR_RADIUS);

      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute("color", new THREE.BufferAttribute(starCol, 3));
      starGeo.setAttribute("aSize", new THREE.BufferAttribute(starSize, 1));
      starGeo.setAttribute("aPhase", new THREE.BufferAttribute(starPhase, 1));

      const starMat = new THREE.ShaderMaterial({
        uniforms: {
          uTexture: { value: starTexture },
          uTime: { value: 0 },
          uOpacity: { value: 1.0 },
          uScale: { value: 215.0 },
        },
        vertexShader: `
          attribute vec3 color;
          attribute float aSize;
          attribute float aPhase;
          varying vec3 vColor;
          varying float vPhase;
          uniform float uScale;
          void main() {
            vColor = color;
            vPhase = aPhase;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * uScale / -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D uTexture;
          uniform float uTime;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vPhase;
          void main() {
            vec4 tex = texture2D(uTexture, gl_PointCoord);
            if (tex.a < 0.045) discard;
            float twinkle = 0.84 + 0.16 * sin(uTime * 0.7 + vPhase);
            gl_FragColor = vec4(vColor * tex.rgb, tex.a * uOpacity * twinkle);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const stars = new THREE.Points(starGeo, starMat);
      stars.visible = false;
      scene.add(stars);

      /* ─── Far water horizon (dark mode only) ─── */
      const horizon = new THREE.Group();
      const HORIZON_SEGMENTS = 240;
      const horizonArcs = [];

      function createHorizonArc(radius, thickness, opacity) {
        const verts = new Float32Array((HORIZON_SEGMENTS + 1) * 2 * 3);
        const indices = [];
        for (let i = 0; i < HORIZON_SEGMENTS; i++) {
          const a = i * 2;
          const b = i * 2 + 1;
          const c = (i + 1) * 2;
          const d = (i + 1) * 2 + 1;
          indices.push(a, b, c, b, d, c);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
        geo.setIndex(indices);
        const mat = new THREE.MeshBasicMaterial({
          color: 0x86a5cf,
          transparent: true,
          opacity,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        mesh.renderOrder = 0.5;
        horizon.add(mesh);
        horizonArcs.push({ geo, verts, radius, thickness });
      }

      createHorizonArc(18, 0.018, 0.12);
      createHorizonArc(25, 0.026, 0.18);
      createHorizonArc(31, 0.045, 0.1);
      horizon.visible = false;
      scene.add(horizon);

      function updateHorizon() {
        const cameraDir = new THREE.Vector2(camera.position.x, camera.position.z);
        if (cameraDir.lengthSq() < 0.0001) cameraDir.set(0, 1);
        cameraDir.normalize();
        const farAngle = Math.atan2(-cameraDir.y, -cameraDir.x);
        const span = Math.PI * 1.06;

        for (const arc of horizonArcs) {
          const verts = arc.verts;
          for (let i = 0; i <= HORIZON_SEGMENTS; i++) {
            const t = i / HORIZON_SEGMENTS;
            const edge = Math.sin(Math.PI * t);
            const thickness = arc.thickness * (0.18 + edge * 0.82);
            const angle = farAngle + (t - 0.5) * span;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const inner = arc.radius - thickness * 0.5;
            const outer = arc.radius + thickness * 0.5;
            const off = i * 2 * 3;
            verts[off] = inner * cos;
            verts[off + 1] = 0.0025;
            verts[off + 2] = inner * sin;
            verts[off + 3] = outer * cos;
            verts[off + 4] = 0.0025;
            verts[off + 5] = outer * sin;
          }
          arc.geo.attributes.position.needsUpdate = true;
        }
      }

      /* ─── Materials ─── */
      const shellMat = new THREE.MeshToonMaterial({
        color: 0xff4f2e,
        gradientMap: null,
      });

      const ribMat = new THREE.MeshToonMaterial({
        color: 0xd9361a,
        gradientMap: null,
      });

      /* ─── Geometry ─── */
      const buoy = new THREE.Group();
      buoy.rotation.set(0.08, 0, 0.18);
      scene.add(buoy);

      // Single shell
      const shellYScale = 0.92;
      const shellRadius = 1.0;

      const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 80, 64), shellMat);
      shell.scale.set(1, shellYScale, 1);
      buoy.add(shell);

      // Rib sits flush: centre = shellRadius + tubeRadius * 0.55
      function ribRadius(tube) {
        return shellRadius + tube * 0.55;
      }

      function shellPoint(lat, lon, r) {
        const h = Math.cos(lat);
        return new THREE.Vector3(
          r * h * Math.sin(lon),
          r * shellYScale * Math.sin(lat),
          r * h * Math.cos(lon),
        );
      }

      function addRib(points, tube, material) {
        const curve = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(curve, points.length * 3, tube, 10, false);
        const mesh = new THREE.Mesh(geo, material);
        buoy.add(mesh);
        return mesh;
      }

      function latRib(lat, lonStart, lonEnd, tube, material = ribMat) {
        const r = ribRadius(tube);
        const pts = [];
        const steps = 120;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const lon = lonStart + (lonEnd - lonStart) * t;
          pts.push(shellPoint(lat, lon, r));
        }
        return addRib(pts, tube, material);
      }

      function lonRib(lon, latStart, latEnd, tube) {
        const r = ribRadius(tube);
        const pts = [];
        const steps = 90;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const lat = latStart + (latEnd - latStart) * t;
          pts.push(shellPoint(lat, lon, r));
        }
        return addRib(pts, tube, ribMat);
      }

      // ─── Horizontal ribs — 4 per hemisphere: 2 body + 2 cap rings ───
      // From equator (0) to outer rings (±1.38); 4 = 4 equal segments
      const spacing = 1.38 / 4;
      const latitudes = [-spacing, -spacing * 2, spacing, spacing * 2];
      latitudes.forEach((lat) => latRib(lat, -Math.PI, Math.PI, 0.009));

      // Equator — thick dark seam
      latRib(0, -Math.PI, Math.PI, 0.027);

      // Thin light highlight line on top of equator
      const equatorMat = new THREE.MeshToonMaterial({
        color: 0xff9b7d,
        gradientMap: null,
      });
      latRib(0, -Math.PI, Math.PI, 0.004, equatorMat);

      // Two top rings (cap area) — no vertical lines here
      latRib(spacing * 3, -Math.PI, Math.PI, 0.01);
      latRib(1.32, -Math.PI, Math.PI, 0.01);

      // Two bottom rings (cap area) — no vertical lines here
      latRib(-spacing * 3, -Math.PI, Math.PI, 0.014);
      latRib(-1.32, -Math.PI, Math.PI, 0.016);

      // ─── Vertical ribs — 24 meridians ───
      // Stop exactly at inner cap rings so they meet flush
      const verticalCount = 24;
      for (let i = 0; i < verticalCount; i++) {
        const lon = (i / verticalCount) * Math.PI * 2 - Math.PI;
        lonRib(lon, -spacing * 3, spacing * 3, 0.007);
      }

      /* ─── Water plane (opaque, matches background, hides submerged hemisphere) ─── */
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(240, 240),
        new THREE.MeshBasicMaterial({ color: theme.water }),
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = 0;
      scene.add(water);

      /* ─── Contact line: where the buoy meets the water ─── */
      // Persistent black ring at the water surface, hugging the buoy's cross-section.
      // Radius tracks the buoy's bob (cross-section shrinks slightly as the buoy rises).
      const CONTACT_SEGMENTS = 220;
      const CONTACT_THICKNESS = 0.014;
      const contactLine = (() => {
        const verts = new Float32Array((CONTACT_SEGMENTS + 1) * 2 * 3);
        const indices = [];
        for (let i = 0; i < CONTACT_SEGMENTS; i++) {
          const a = i * 2;
          const b = i * 2 + 1;
          const c = (i + 1) * 2;
          const d = (i + 1) * 2 + 1;
          indices.push(a, b, c, b, d, c);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
        geo.setIndex(indices);
        const mat = new THREE.MeshBasicMaterial({
          color: theme.line,
          side: THREE.DoubleSide,
          depthWrite: false,
          transparent: true,
          opacity: 0.9,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        mesh.renderOrder = 1;
        scene.add(mesh);
        return { geo, verts, mat };
      })();

      function updateContactLine() {
        // Cross-section radius of the (slightly oblate) buoy at the water plane
        const by = buoy.position.y;
        const yLocal = by / shellYScale;
        const radius = shellRadius * Math.sqrt(Math.max(0, 1 - yLocal * yLocal));
        const halfT = CONTACT_THICKNESS * 0.5;
        const verts = contactLine.verts;
        for (let i = 0; i <= CONTACT_SEGMENTS; i++) {
          const theta = (i / CONTACT_SEGMENTS) * Math.PI * 2;
          const cos = Math.cos(theta);
          const sin = Math.sin(theta);
          const inner = radius - halfT;
          const outer = radius + halfT;
          const off = i * 2 * 3;
          verts[off] = inner * cos;
          verts[off + 1] = 0.003;
          verts[off + 2] = inner * sin;
          verts[off + 3] = outer * cos;
          verts[off + 4] = 0.003;
          verts[off + 5] = outer * sin;
        }
        contactLine.geo.attributes.position.needsUpdate = true;
      }

      /* ─── Emanating ripple rings ─── */
      // Each ring is a thin ribbon mesh, so its thickness can vary around the
      // perimeter (like a brush-pressure ink line). Rings spawn in lockstep with
      // the buoy's bob rhythm — one ring at every bob extreme.

      const BOB_OMEGA = 1.0; // rad/s — used for both buoy bob and ring cadence
      const BOB_PERIOD = (2 * Math.PI) / BOB_OMEGA; // ≈ 6.28s — full bob cycle

      const RING_SEGMENTS = 260;
      const RING_LIFE = 22.0; // seconds from spawn to death — very slow drift
      const RING_START_R = shellRadius * 1.04;
      const RING_END_R = shellRadius * 2.2; // tighter rings, closer to the buoy
      const rings = [];
      let lastSpawnedCycle = -1;

      function spawnRing(t) {
        const mat = new THREE.MeshBasicMaterial({
          color: theme.line,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const geo = new THREE.BufferGeometry();
        const verts = new Float32Array((RING_SEGMENTS + 1) * 2 * 3);
        geo.setAttribute("position", new THREE.BufferAttribute(verts, 3));
        const indices = [];
        for (let i = 0; i < RING_SEGMENTS; i++) {
          const a = i * 2;
          const b = i * 2 + 1;
          const c = (i + 1) * 2;
          const d = (i + 1) * 2 + 1;
          indices.push(a, b, c, b, d, c);
        }
        geo.setIndex(indices);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        scene.add(mesh);

        // Three harmonics summed → organic, never quite circular
        const waveAmps = [
          0.055 + Math.random() * 0.03,
          0.025 + Math.random() * 0.015,
          0.012 + Math.random() * 0.008,
        ];
        const waveFreqs = [
          2 + Math.floor(Math.random() * 2), // 2-3
          5 + Math.floor(Math.random() * 3), // 5-7
          8 + Math.floor(Math.random() * 3), // 8-10
        ];
        const wavePhases = [
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2,
        ];

        rings.push({
          bornAt: t,
          life: RING_LIFE * (0.9 + Math.random() * 0.2),
          mat,
          geo,
          mesh,
          verts,
          waveAmps,
          waveFreqs,
          wavePhases,
          // Uniform thickness around this ring's perimeter; modest variance between rings
          thickness: 0.011 + Math.random() * 0.008,
        });
      }

      function updateRings(t) {
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          const age = t - r.bornAt;
          const u = age / r.life;
          if (u >= 1) {
            scene.remove(r.mesh);
            r.geo.dispose();
            r.mat.dispose();
            rings.splice(i, 1);
            continue;
          }
          // Linear growth — calm, constant pace
          const radius = RING_START_R + (RING_END_R - RING_START_R) * u;

          // Gentle opacity envelope — long fade-out so rings dissolve well before
          // they reach the outer radius
          let env;
          if (u < 0.18) env = u / 0.18;
          else if (u > 0.32) env = (1 - u) / 0.68;
          else env = 1;
          r.mat.opacity = env * 0.7;

          const verts = r.verts;
          const halfT = r.thickness * 0.5;
          for (let j = 0; j <= RING_SEGMENTS; j++) {
            const theta = (j / RING_SEGMENTS) * Math.PI * 2;
            const cos = Math.cos(theta);
            const sin = Math.sin(theta);

            // Organic radial wave (sum of harmonics)
            let wave = 0;
            for (let k = 0; k < 3; k++) {
              wave += r.waveAmps[k] * Math.sin(r.waveFreqs[k] * theta + r.wavePhases[k]);
            }
            const rr = radius + wave;
            const inner = rr - halfT;
            const outer = rr + halfT;

            const off = j * 2 * 3;
            verts[off] = inner * cos;
            verts[off + 1] = 0.002;
            verts[off + 2] = inner * sin;
            verts[off + 3] = outer * cos;
            verts[off + 4] = 0.002;
            verts[off + 5] = outer * sin;
          }
          r.geo.attributes.position.needsUpdate = true;
        }
      }

      // Pre-seed rings on the bob-rhythm grid so the scene starts mid-cadence
      for (let k = 1; k <= 3; k++) {
        spawnRing(-BOB_PERIOD * k);
      }

      /* ─── Lighting ─── */
      // Flat but dimensional: hemisphere + 2 directional
      const hemi = new THREE.HemisphereLight(theme.hemiSky, theme.hemiGround, theme.hemiIntensity);
      scene.add(hemi);

      const key = new THREE.DirectionalLight(theme.keyColor, theme.keyIntensity);
      key.position.set(3.5, 5, 4);
      scene.add(key);

      const fill = new THREE.DirectionalLight(theme.fillColor, theme.fillIntensity);
      fill.position.set(-3, 2, -3);
      scene.add(fill);

      /* ─── Apply theme to scene ─── */
      function applyTheme(name) {
        themeName = name;
        theme = THEMES[name];
        document.documentElement.dataset.theme = name;
        scene.background = name === "dark" ? nightBackgroundTexture : new THREE.Color(theme.bg);
        water.material.color.setHex(theme.water);
        stars.visible = name === "dark";
        horizon.visible = name === "dark";

        contactLine.mat.color.setHex(theme.contactLine);
        for (const r of rings) r.mat.color.setHex(theme.line);
        hemi.color.setHex(theme.hemiSky);
        hemi.groundColor.setHex(theme.hemiGround);
        hemi.intensity = theme.hemiIntensity;
        key.color.setHex(theme.keyColor);
        key.intensity = theme.keyIntensity;
        fill.color.setHex(theme.fillColor);
        fill.intensity = theme.fillIntensity;
        themeBtn.dataset.on = name === "dark" ? "true" : "false";
      }

      /* ─── Loop ─── */
      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", resize);

      const clock = new THREE.Clock();
      const baseRotX = buoy.rotation.x;
      const baseRotZ = buoy.rotation.z;

      function animate() {
        const t = clock.getElapsedTime();
        buoy.position.y = 0.05 * Math.sin(t * BOB_OMEGA);
        buoy.rotation.x = baseRotX + 0.025 * Math.sin(t * 0.75 + 1.1);
        buoy.rotation.z = baseRotZ + 0.025 * Math.sin(t * 0.9 + 0.4);

        // Spawn one ring per full bob cycle (half as many as before)
        const cycleIdx = Math.floor((t * BOB_OMEGA) / (2 * Math.PI));
        if (cycleIdx > lastSpawnedCycle) {
          spawnRing(t);
          lastSpawnedCycle = cycleIdx;
        }
        updateRings(t);
        updateContactLine();
        updateHorizon();

        // Twinkle the dark-mode star field.
        starMat.uniforms.uTime.value = t;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      /* ─── Theme toggle ─── */
      const themeBtn = document.getElementById("theme-toggle");
      applyTheme(themeName);
      themeBtn.addEventListener("click", () => {
        const next = themeName === "dark" ? "light" : "dark";
        applyTheme(next);
        localStorage.setItem("mooring-buoy-theme", next);
      });

      /* ─── Ambient audio toggle ─── */
      const audio = document.getElementById("ambience");
      const audioBtn = document.getElementById("audio-toggle");
      audio.volume = 0.35;
      audioBtn.addEventListener("click", async () => {
        const on = audioBtn.dataset.on === "true";
        if (on) {
          audio.pause();
          audioBtn.dataset.on = "false";
        } else {
          try {
            await audio.play();
            audioBtn.dataset.on = "true";
          } catch (e) {
            audioBtn.dataset.on = "false";
          }
        }
      });
    </script>
  </body>
</html>
